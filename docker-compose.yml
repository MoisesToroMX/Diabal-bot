services:
  backend:
    build:
      context: ./diabal-bot-backend
    environment:
      PORT: 3001
      CORS_ORIGINS: http://localhost:8081,http://localhost:5173
      MAX_UPLOAD_BYTES: 10485760
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./diabal-bot-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
